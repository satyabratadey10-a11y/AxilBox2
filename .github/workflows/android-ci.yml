name: Android CI & Guest Engine Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1 — Kernel: Standard aarch64 cross-compile using kbuild directly
  # =========================================================================
  build-kernel:
    name: "Job 1 — Build ARM64 Virt Linux Kernel"
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Kernel Build Cache
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            linux-src/arch/arm64/boot/Image
            linux-src/.config
          key: kernel-virt-v6.6-${{ hashFiles('tools/kernel/configure-virt-kernel.sh') }}

      - name: Install Toolchain & Build Dependencies
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bison \
            flex \
            libssl-dev \
            bc \
            libelf-dev \
            kmod \
            file

      - name: Shallow Clone Linux Kernel (v6.6 LTS)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v6.6 https://github.com/torvalds/linux.git linux-src

      - name: Configure Kernel for QEMU virt Machine (PLAN.md Stage 1)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: linux-src
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash ../tools/kernel/configure-virt-kernel.sh
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "=== Post-olddefconfig Initramfs Capability Assertion ==="
          grep -E "^(CONFIG_BLK_DEV_INITRD|CONFIG_RD_GZIP)=y" .config

      - name: Build ARM64 Kernel Image
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        working-directory: linux-src
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Verify Kernel Image Artifact
        run: |
          ls -lh linux-src/arch/arm64/boot/Image
          file linux-src/arch/arm64/boot/Image

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-kernel-image
          path: linux-src/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Alpine Minirootfs & Convert to newc cpio.gz
        run: |
          bash tools/rootfs/prepare-alpine-rootfs.sh rootfs-bundle/rootfs.cpio.gz downloads/rootfs

      - name: Upload Guest Rootfs Initrd Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-rootfs-initrd
          path: rootfs-bundle/rootfs.cpio.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload Original Verified Alpine Minirootfs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-minirootfs-original
          path: downloads/rootfs/
          if-no-files-found: error
          retention-days: 7

  # =========================================================================
  # JOB 2 — QEMU + deps: Termux Bionic aarch64 jniLibs Packaging
  # =========================================================================
  build-qemu:
    name: "Job 2 — Build/Package QEMU aarch64 & Bionic Dependencies"
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf binutils-aarch64-linux-gnu file curl python3

      - name: Provision QEMU, Bionic Shared Libs Bundle & pc-bios Assets
        run: |
          bash tools/engine/package-termux-qemu.sh jniLibs-bundle/arm64-v8a assets-bundle/engine/pc-bios

      - name: Audit ELF Shared Objects & Reject Linker Scripts / Stubs
        run: |
          python3 - <<'EOF'
          import os, sys, subprocess

          bundle_dir = "jniLibs-bundle/arm64-v8a"
          bundle_files = [f for f in sorted(os.listdir(bundle_dir)) if f.startswith("lib") and f.endswith(".so")]

          print(f"=== Auditing {len(bundle_files)} bundle libraries with file and size checks ===")
          invalid_files = []

          for fname in bundle_files:
              fpath = os.path.join(bundle_dir, fname)
              size = os.path.getsize(fpath)
              out = subprocess.check_output(["file", "-b", fpath], text=True, errors="ignore").strip()
              print(f"  [{fname}] ({size} bytes): {out}")

              # Confirm not near-zero-byte stub
              if size < 1024:
                  invalid_files.append((fname, f"near-zero-byte stub ({size} bytes)", out))
                  continue

              # Confirm not ASCII text or linker script
              if "ASCII text" in out or "linker script" in out:
                  invalid_files.append((fname, "ASCII text / linker script instead of ELF binary", out))
                  continue

              # Confirm output says ELF 64-bit and shared object (or executable for QEMU binary)
              if "ELF 64-bit" not in out:
                  invalid_files.append((fname, "not ELF 64-bit", out))
                  continue
              if "shared object" not in out and "executable" not in out:
                  invalid_files.append((fname, "not an ELF shared object", out))
                  continue

          if invalid_files:
              print("\nFATAL: Packaging defect detected! The following libraries are stubs or linker scripts:", file=sys.stderr)
              for fname, reason, out in invalid_files:
                  print(f"  - {fname}: {reason} (file: '{out}')", file=sys.stderr)
              sys.exit(1)

          print(f"✓ All {len(bundle_files)} bundle files are verified genuine ELF 64-bit shared objects.")
          EOF

      - name: Strict Transitive Dependency Assertion (DT_NEEDED Completeness)
        run: |
          python3 - <<'EOF'
          import os, sys, subprocess, re

          bundle_dir = "jniLibs-bundle/arm64-v8a"
          system_libs = {"libc.so", "libm.so", "libdl.so", "liblog.so"}
          bundle_files = set(os.listdir(bundle_dir))

          print(f"=== Checking DT_NEEDED Completeness across {len(bundle_files)} libraries ===")
          missing_deps = {}

          for fname in sorted(bundle_files):
              if not (fname.startswith("lib") and fname.endswith(".so")):
                  continue
              fpath = os.path.join(bundle_dir, fname)
              try:
                  out = subprocess.check_output(["readelf", "-d", fpath], text=True, errors="ignore")
              except Exception as e:
                  print(f"Error reading ELF headers for {fname}: {e}", file=sys.stderr)
                  sys.exit(1)

              for line in out.splitlines():
                  if "(NEEDED)" in line:
                      m = re.search(r'\[(.*?)\]', line)
                      if m:
                          dep = m.group(1)
                          if dep in system_libs:
                              continue
                          if dep not in bundle_files:
                              missing_deps.setdefault(fname, []).append(dep)

          if missing_deps:
              print("FATAL: Found unsatisfied transitive DT_NEEDED dependencies:", file=sys.stderr)
              for so, missing in missing_deps.items():
                  print(f"  - {so} missing: {missing}", file=sys.stderr)
              sys.exit(1)

          print("✓ 100% DT_NEEDED completeness verified: all transitive dependencies are present in the bundle.")
          EOF

      - name: Strict Dynamic Symbol-Level Closure Assertion (readelf --dyn-syms)
        run: |
          python3 - <<'EOF'
          import os, sys, subprocess, re, glob

          bundle_dir = "jniLibs-bundle/arm64-v8a"
          bundle_files = [f for f in sorted(os.listdir(bundle_dir)) if f.startswith("lib") and f.endswith(".so")]
          print(f"=== Dynamic Symbol-Level Closure Verification across {len(bundle_files)} bundle libraries ===")

          readelf_bin = "aarch64-linux-gnu-readelf" if subprocess.run(["which", "aarch64-linux-gnu-readelf"], stdout=subprocess.DEVNULL).returncode == 0 else "readelf"

          # 1. Discover Bionic-provided symbols from NDK sysroots and baseline patterns
          bionic_libs = {"libc.so", "libm.so", "libdl.so", "liblog.so"}
          bionic_symbols = set()

          ndk_search_paths = [
              "/usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/*",
              "/usr/local/lib/android/sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android",
              "/usr/local/lib/android/sdk/ndk/*/platforms/android-*/arch-arm64/usr/lib",
              "/opt/android-sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/*",
              os.path.expanduser("~/Android/Sdk/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/*")
          ]
          ndk_dirs = []
          for p in ndk_search_paths:
              ndk_dirs.extend(glob.glob(p))

          for base_dir in [
              os.environ.get("ANDROID_NDK_HOME", ""),
              os.environ.get("ANDROID_NDK_ROOT", ""),
              os.environ.get("ANDROID_HOME", ""),
              "/usr/local/lib/android/sdk",
              "/opt/android-sdk",
              os.path.expanduser("~/Android")
          ]:
              if base_dir and os.path.isdir(base_dir):
                  for root, _, files in os.walk(base_dir):
                      if any(x in root for x in ("aarch64", "arm64")):
                          if any(blib in files for blib in bionic_libs):
                              ndk_dirs.append(root)

          for ndk_dir in set(ndk_dirs):
              for blib in bionic_libs:
                  target = os.path.join(ndk_dir, blib)
                  if os.path.exists(target):
                      try:
                          out = subprocess.check_output([readelf_bin, "-W", "--dyn-syms", target], text=True, errors="ignore")
                          for line in out.splitlines():
                              parts = line.strip().split()
                              if len(parts) >= 8:
                                  bind = parts[4]
                                  vis = parts[5]
                                  ndx = parts[6]
                                  name = parts[7]
                                  if bind in ("GLOBAL", "WEAK") and vis == "DEFAULT" and ndx not in ("UND", "UNDEF") and not ndx.startswith("UND"):
                                      clean = re.sub(r'@+.*$', '', name)
                                      if clean:
                                          bionic_symbols.add(clean)
                                          bionic_symbols.add(name)
                      except Exception as e:
                          print(f"Note: Error reading NDK bionic lib {target}: {e}")

          # Baseline Bionic system symbols (standard C/POSIX/libm/libdl/liblog)
          STANDARD_BIONIC = {
              "malloc", "calloc", "realloc", "free", "posix_memalign", "aligned_alloc", "valloc",
              "printf", "fprintf", "sprintf", "snprintf", "vprintf", "vfprintf", "vsprintf", "vsnprintf",
              "puts", "fputs", "putchar", "fputc", "getchar", "fgetc", "fgets", "fread", "fwrite", "feof", "ferror",
              "feof_unlocked", "ferror_unlocked", "fputc_unlocked", "fputs_unlocked", "fread_unlocked", "fwrite_unlocked",
              "getchar_unlocked", "putchar_unlocked", "getc_unlocked", "putc_unlocked", "fileno_unlocked", "clearerr_unlocked", "fflush_unlocked",
              "fopen", "fdopen", "freopen", "fclose", "fflush", "fseek", "fseeko", "ftell", "ftello", "rewind",
              "fileno", "clearerr", "setvbuf", "setbuf", "ungetc", "sscanf", "vsscanf", "scanf", "fscanf",
              "memcpy", "memmove", "memset", "memcmp", "memchr", "memrchr", "memmem", "bzero", "bcopy",
              "strlen", "strnlen", "strcpy", "strncpy", "strlcpy", "strcat", "strncat", "strlcat",
              "strcmp", "strncmp", "strcasecmp", "strncasecmp", "strchr", "strrchr", "strstr", "strcasestr",
              "strspn", "strcspn", "strpbrk", "strtok", "strtok_r", "strdup", "strndup", "strerror", "strerror_r",
              "strcoll", "strxfrm", "strsignal",
              "atoi", "atol", "atoll", "atof", "strtol", "strtoll", "strtoul", "strtoull", "strtof", "strtod", "strtold",
              "isalnum", "isalpha", "iscntrl", "isdigit", "isgraph", "islower", "isprint", "ispunct", "isspace", "isupper", "isxdigit", "tolower", "toupper",
              "sin", "sinf", "cos", "cosf", "tan", "tanf", "asin", "asinf", "acos", "acosf", "atan", "atanf", "atan2", "atan2f",
              "sinh", "sinhf", "cosh", "coshf", "tanh", "tanhf", "exp", "expf", "exp2", "exp2f", "log", "logf", "log2", "log2f", "log10", "log10f",
              "pow", "powf", "sqrt", "sqrtf", "cbrt", "cbrtf", "hypot", "hypotf", "ceil", "ceilf", "floor", "floorf", "trunc", "truncf",
              "round", "roundf", "rint", "rintf", "nearbyint", "nearbyintf", "fabs", "fabsf", "fmod", "fmodf", "remainder", "remainderf",
              "fmax", "fmaxf", "fmin", "fminf", "fdim", "fdimf", "isnan", "isinf", "isfinite", "fpclassify", "signbit", "ldexp", "ldexpf", "frexp", "frexpf", "modf", "modff",
              "wcslen", "wcscpy", "wcsncpy", "wcscat", "wcsncat", "wcscmp", "wcsncmp", "wcschr", "wcsrchr", "wcsstr", "wmemchr", "wmemcmp", "wmemcpy", "wmemmove", "wmemset", "mbstowcs", "wcstombs", "mbtowc", "wctomb",
              "wcscoll", "wcsxfrm", "wcsnlen", "wcscasecmp", "wcsncasecmp", "wcstoll", "wcstoull", "wcstold", "wcstod", "wcstof",
              "open", "openat", "creat", "close", "read", "write", "pread", "pread64", "pwrite", "pwrite64",
              "lseek", "lseek64", "dup", "dup2", "dup3", "pipe", "pipe2", "fcntl", "ioctl",
              "stat", "fstat", "lstat", "fstatat", "stat64", "fstat64", "lstat64", "statfs", "fstatfs", "statvfs",
              "access", "faccessat", "chmod", "fchmod", "fchmodat", "chown", "fchown", "fchownat", "unlink", "unlinkat",
              "mkdir", "mkdirat", "rmdir", "rename", "renameat", "renameat2", "link", "linkat", "symlink", "symlinkat",
              "readlink", "readlinkat", "truncate", "ftruncate", "truncate64", "ftruncate64",
              "mmap", "mmap64", "munmap", "mprotect", "msync", "madvise", "posix_madvise", "mlock", "munlock", "mremap", "mincore",
              "poll", "ppoll", "select", "pselect", "epoll_create", "epoll_create1", "epoll_ctl", "epoll_wait", "epoll_pwait",
              "eventfd", "signalfd", "timerfd_create", "timerfd_settime", "timerfd_gettime",
              "getopt", "getopt_long", "getopt_long_only", "optarg", "optind", "opterr", "optopt",
              "socket", "socketpair", "bind", "listen", "accept", "accept4", "connect", "getsockname", "getpeername",
              "send", "sendto", "sendmsg", "recv", "recvfrom", "recvmsg", "shutdown", "getsockopt", "setsockopt",
              "getaddrinfo", "freeaddrinfo", "getnameinfo", "gai_strerror", "inet_addr", "inet_aton", "inet_ntoa", "inet_pton", "inet_ntop",
              "gethostbyname", "gethostbyaddr", "sethostent", "endhostent",
              "pthread_create", "pthread_exit", "pthread_join", "pthread_detach", "pthread_self", "pthread_equal",
              "pthread_mutex_init", "pthread_mutex_destroy", "pthread_mutex_lock", "pthread_mutex_unlock", "pthread_mutex_trylock", "pthread_mutex_timedlock",
              "pthread_mutexattr_init", "pthread_mutexattr_destroy", "pthread_mutexattr_settype", "pthread_mutexattr_gettype",
              "pthread_cond_init", "pthread_cond_destroy", "pthread_cond_wait", "pthread_cond_timedwait", "pthread_cond_signal", "pthread_cond_broadcast",
              "pthread_condattr_init", "pthread_condattr_destroy",
              "pthread_rwlock_init", "pthread_rwlock_destroy", "pthread_rwlock_rdlock", "pthread_rwlock_wrlock", "pthread_rwlock_unlock",
              "pthread_key_create", "pthread_key_delete", "pthread_getspecific", "pthread_setspecific", "pthread_once",
              "pthread_attr_init", "pthread_attr_destroy", "pthread_attr_setstacksize", "pthread_attr_getstacksize", "pthread_attr_setdetachstate",
              "pthread_setname_np", "pthread_getname_np", "pthread_sigmask", "pthread_kill",
              "sem_init", "sem_destroy", "sem_wait", "sem_trywait", "sem_timedwait", "sem_post", "sem_getvalue",
              "sigaction", "signal", "sigprocmask", "sigsuspend", "sigpending", "sigemptyset", "sigfillset", "sigaddset", "sigdelset", "sigismember",
              "sigaltstack", "siglongjmp", "setjmp", "longjmp", "_setjmp", "_longjmp",
              "kill", "raise", "abort", "exit", "_exit", "_Exit", "quick_exit", "atexit", "at_quick_exit",
              "getenv", "setenv", "unsetenv", "putenv", "clearenv",
              "fork", "vfork", "execve", "execv", "execvp", "execvpe", "wait", "waitpid", "waitid",
              "posix_spawn", "posix_spawnp", "process_vm_readv", "process_vm_writev",
              "getpid", "getppid", "getuid", "geteuid", "getgid", "getegid", "setuid", "setgid", "seteuid", "setegid",
              "getgroups", "setgroups", "getpgrp", "setpgrp", "getpgid", "setpgid", "setsid", "getsid",
              "gettimeofday", "settimeofday", "time", "clock_gettime", "clock_settime", "clock_getres", "clock_nanosleep", "nanosleep",
              "localtime", "localtime_r", "gmtime", "gmtime_r", "mktime", "asctime", "ctime", "strftime", "strptime",
              "gmtime_s", "timegm", "timelocal", "difftime",
              "dlopen", "dlclose", "dlsym", "dlerror", "dladdr", "dl_iterate_phdr",
              "__android_log_print", "__android_log_write", "__android_log_vprint", "__android_log_assert", "__android_log_buf_print",
              "__cxa_finalize", "__cxa_atexit", "__register_atfork", "__stack_chk_guard", "__stack_chk_fail",
              "__errno", "errno", "__sF", "__get_tls", "__system_property_get", "__system_property_read",
              "__gxx_personality_v0", "_Unwind_Resume", "_Unwind_RaiseException", "_Unwind_GetIP", "_Unwind_SetIP",
              "__cmsg_nxthdr", "__gnu_strerror_r", "__fsetlocking",
              "sysconf", "sysinfo", "uname", "getpagesize", "getrlimit", "setrlimit", "getrusage", "getpriority", "setpriority",
              "sched_yield", "sched_getaffinity", "sched_setaffinity", "sched_getparam", "sched_setparam", "sched_getscheduler", "sched_setscheduler",
              "syscall", "personality", "prctl", "ptrace", "capget", "capset",
              "gettid", "getauxval", "arc4random", "arc4random_buf", "arc4random_uniform",
              "setlocale", "uselocale", "newlocale", "freelocale", "duplocale", "nl_langinfo", "nl_langinfo_l",
              "strtold_l", "strtod_l", "strtof_l", "strtoll_l", "strtoull_l", "strtol_l", "strtoul_l",
              "pathconf", "fpathconf", "posix_fadvise", "posix_fallocate", "fallocate", "sync", "syncfs", "fsync", "fdatasync",
              "getpwuid", "getpwuid_r", "getpwnam", "getpwnam_r", "getgrgid", "getgrgid_r", "getgrnam", "getgrnam_r",
              "getlogin", "getlogin_r", "gethostname", "sethostname",
              "futimes", "utimes", "lutimes", "utimensat", "futimens", "mknod", "mknodat",
              "splice", "tee", "vmsplice", "sendfile", "sendfile64", "getrandom", "memfd_create", "sync_file_range", "readv", "writev", "preadv", "pwritev"
          }
          bionic_symbols.update(STANDARD_BIONIC)
          print(f" -> Total Bionic reference symbols recognized: {len(bionic_symbols)}")

          # 2. Collect GLOBAL/WEAK DEFAULT exported symbols across bundle
          bundle_exports = set()
          export_origins = {}

          for fname in bundle_files:
              fpath = os.path.join(bundle_dir, fname)
              try:
                  out = subprocess.check_output([readelf_bin, "-W", "--dyn-syms", fpath], text=True, errors="ignore")
              except Exception as e:
                  print(f"Error reading dynsyms for {fname}: {e}", file=sys.stderr)
                  sys.exit(1)

              for line in out.splitlines():
                  parts = line.strip().split()
                  if len(parts) >= 8:
                      bind = parts[4]
                      vis = parts[5]
                      ndx = parts[6]
                      name = parts[7]
                      if bind in ("GLOBAL", "WEAK") and vis == "DEFAULT" and ndx not in ("UND", "UNDEF") and not ndx.startswith("UND"):
                          clean_name = re.sub(r'@+.*$', '', name)
                          if clean_name:
                              bundle_exports.add(clean_name)
                              bundle_exports.add(name)
                              export_origins.setdefault(clean_name, []).append(fname)

          print(f" -> Indexed {len(bundle_exports)} unique exported symbols across bundle.")

          # 3. Collect UND (undefined/required) symbols and verify symbol-level closure
          unsatisfied = {}

          for fname in bundle_files:
              fpath = os.path.join(bundle_dir, fname)
              try:
                  out = subprocess.check_output([readelf_bin, "-W", "--dyn-syms", fpath], text=True, errors="ignore")
              except Exception as e:
                  print(f"Error reading dynsyms for {fname}: {e}", file=sys.stderr)
                  sys.exit(1)

              for line in out.splitlines():
                  parts = line.strip().split()
                  if len(parts) >= 8:
                      bind = parts[4]
                      ndx = parts[6]
                      name = parts[7]
                      if (ndx in ("UND", "UNDEF") or ndx.startswith("UND")) and bind == "GLOBAL":
                          clean_name = re.sub(r'@+.*$', '', name)
                          if not clean_name:
                              continue
                          if clean_name in bionic_symbols or name in bionic_symbols:
                              continue
                          if clean_name in bundle_exports or name in bundle_exports:
                              continue
                          # Bionic fortify, compiler builtins, and standard architecture ABI
                          if clean_name.startswith("__android") or clean_name.startswith("__isoc") or clean_name.startswith("__bionic") or clean_name.startswith("__aeabi_") or clean_name.startswith("__builtin_"):
                              continue
                          if clean_name.startswith("__") and clean_name.endswith("_chk"):
                              continue
                          unsatisfied.setdefault(fname, set()).add(clean_name)

          if unsatisfied:
              print("\n==================================================================", file=sys.stderr)
              print("FATAL: Symbol-level closure verification FAILED!", file=sys.stderr)
              print("The following required symbols are NOT satisfied by any library in the bundle or Bionic:", file=sys.stderr)
              for fname, syms in sorted(unsatisfied.items()):
                  print(f"\n  Library [{fname}] requires {len(syms)} unsatisfied symbol(s):", file=sys.stderr)
                  for s in sorted(syms):
                      print(f"    - {s}", file=sys.stderr)
              print("==================================================================", file=sys.stderr)
              sys.exit(1)

          print(f"✓ 100% Symbol-level closure verified across all {len(bundle_files)} native libraries!")
          EOF

      - name: Strict pc-bios Option-ROM & Firmware Asset Assertion
        run: |
          python3 - <<'EOF'
          import os, sys

          pc_bios_dir = "assets-bundle/engine/pc-bios"
          if not os.path.isdir(pc_bios_dir):
              print(f"FATAL: pc-bios directory '{pc_bios_dir}' does not exist!", file=sys.stderr)
              sys.exit(1)

          all_entries = sorted(os.listdir(pc_bios_dir))
          print(f"=== Auditing pc-bios Firmware/Option-ROM Directory ({len(all_entries)} entries) ===")
          
          rom_count = 0
          for entry in all_entries:
              p = os.path.join(pc_bios_dir, entry)
              if os.path.isfile(p):
                  size = os.path.getsize(p)
                  print(f"  * [rom] {entry:<30} ({size:>8} bytes)")
                  rom_count += 1
              elif os.path.isdir(p):
                  children = len(os.listdir(p))
                  print(f"  * [dir] {entry:<30} ({children} items)")

          if rom_count == 0:
              print("FATAL: pc-bios directory is empty!", file=sys.stderr)
              sys.exit(1)

          # Required ROM files QEMU aarch64 expects by default
          required_roms = [
              "efi-virtio.rom",
              "efi-e1000.rom"
          ]

          missing_roms = []
          for rom in required_roms:
              p = os.path.join(pc_bios_dir, rom)
              if not os.path.exists(p):
                  missing_roms.append((rom, "file not found"))
              elif os.path.getsize(p) < 1024:
                  missing_roms.append((rom, f"file too small ({os.path.getsize(p)} bytes)"))

          if missing_roms:
              print("\n==================================================================", file=sys.stderr)
              print("FATAL: pc-bios option-ROM assertion FAILED!", file=sys.stderr)
              print("The following required firmware/ROM files are missing or invalid:", file=sys.stderr)
              for rom, reason in missing_roms:
                  print(f"  - {rom}: {reason}", file=sys.stderr)
              print("==================================================================", file=sys.stderr)
              sys.exit(1)

          # Assert that no bloatware EDK2 UEFI images (*.fd) are bundled
          fd_files = [e for e in all_entries if e.endswith(".fd") or "edk2" in e.lower()]
          if fd_files:
              print(f"FATAL: Unneeded EDK2 UEFI firmware files detected in pc-bios asset bundle: {fd_files}", file=sys.stderr)
              sys.exit(1)

          print(f"\n✓ 100% pc-bios option-ROM integrity verified: {rom_count} firmware/ROM files present, all default ROMs ({', '.join(required_roms)}) verified, zero EDK2 bloat!")
          EOF

      - name: Upload QEMU jniLibs Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-jniLibs-bundle
          path: jniLibs-bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Upload QEMU pc-bios Assets Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-pc-bios-assets
          path: assets-bundle/
          if-no-files-found: error
          retention-days: 7

  # =========================================================================
  # JOB 3 — App Build: Bundle Job 1 & 2 Artifacts + Host QEMU Kernel Sanity Check
  # =========================================================================
  build-app:
    name: "Job 3 — App Build & Host QEMU Kernel Sanity Check"
    runs-on: ubuntu-latest
    needs: [build-kernel, build-qemu]
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Download Kernel Artifact (Job 1)
        uses: actions/download-artifact@v4
        with:
          name: guest-kernel-image
          path: app/src/main/assets/kernel/

      - name: Download Guest Rootfs Initrd Artifact (Job 1)
        uses: actions/download-artifact@v4
        with:
          name: guest-rootfs-initrd
          path: app/src/main/assets/kernel/

      - name: Download QEMU jniLibs Bundle Artifact (Job 2)
        uses: actions/download-artifact@v4
        with:
          name: qemu-jniLibs-bundle
          path: app/src/main/jniLibs/

      - name: Download QEMU pc-bios Assets Artifact (Job 2)
        uses: actions/download-artifact@v4
        with:
          name: qemu-pc-bios-assets
          path: app/src/main/assets/

      - name: Verify Packaged Asset & jniLibs Structure
        run: |
          echo "=== App Raw Assets (Kernel & Initrd) ==="
          ls -lh app/src/main/assets/kernel/
          file app/src/main/assets/kernel/Image
          file app/src/main/assets/kernel/rootfs.cpio.gz
          echo "=== App Raw Assets (pc-bios) ==="
          ls -lh app/src/main/assets/engine/pc-bios/ | head -n 30
          echo "=== App Native Libraries (jniLibs/arm64-v8a) ==="
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK Contents & Size Breakdown
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Debug APK File Size ==="
          ls -lh "${APK_PATH}"

          echo "=== Top 25 Entries by Uncompressed Size in Debug APK (unzip -lv) ==="
          python3 - <<'EOF'
          import subprocess, sys

          cmd = ["unzip", "-lv", "app/build/outputs/apk/debug/app-debug.apk"]
          out = subprocess.check_output(cmd, text=True, errors="ignore")
          entries = []
          for line in out.splitlines():
              parts = line.strip().split(None, 7)
              if len(parts) >= 8 and parts[0].isdigit():
                  try:
                      length = int(parts[0])
                      cmpr_size = int(parts[2])
                      name = parts[7]
                      entries.append((length, cmpr_size, name))
                  except ValueError:
                      pass

          entries.sort(key=lambda x: x[0], reverse=True)
          print(f"{'Rank':<5} {'Uncompressed':<14} {'Compressed':<14} {'Name'}")
          print("=" * 80)
          for i, (length, cmpr_size, name) in enumerate(entries[:25], 1):
              print(f"{i:<5} {length:<14} {cmpr_size:<14} {name}")

          # Explicit assertions
          names = [e[2] for e in entries]
          assert any("efi-virtio.rom" in n for n in names), "FATAL: efi-virtio.rom missing from APK!"
          assert any("efi-e1000.rom" in n for n in names), "FATAL: efi-e1000.rom missing from APK!"
          assert any("assets/kernel/Image" in n for n in names), "FATAL: assets/kernel/Image missing from APK!"
          assert any("assets/kernel/rootfs.cpio" in n for n in names), "FATAL: assets/kernel/rootfs.cpio(.gz) missing from APK!"

          fd_files = [n for n in names if n.endswith(".fd") or "edk2" in n.lower()]
          if fd_files:
              print(f"FATAL: EDK2 UEFI firmware images found in APK: {fd_files}", file=sys.stderr)
              sys.exit(1)

          print("\n✓ 100% APK contents verified: kernel Image, rootfs initrd, and required ROMs present; zero EDK2 bloat!")
          EOF

      - name: Install QEMU Runner for Host Sanity Check
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc

      - name: Kernel & Userspace Sanity Check via Host-Native QEMU
        run: |
          echo "=== Running Kernel & Userspace Sanity Check via Host-Native QEMU Runner ==="
          echo "Note: This step verifies the built ARM64 Linux kernel Image and guest initramfs using the host runner's native QEMU emulator."
          echo "The bundled Android Bionic QEMU binary in jniLibs requires a physical ARM64 Android device with nativeLibraryDir execution."
          
          qemu-system-aarch64 \
            -L app/src/main/assets/engine/pc-bios \
            -M virt,gic-version=3 \
            -cpu max \
            -smp 2 \
            -m 512M \
            -kernel app/src/main/assets/kernel/Image \
            -initrd app/src/main/assets/kernel/rootfs.cpio.gz \
            -append "console=ttyAMA0 earlycon=pl011,0x09000000 panic=-1 rdinit=/sbin/init printk.devkmsg=on" \
            -display none \
            -monitor none \
            -serial stdio \
            -no-reboot > host-qemu-boot.log 2>&1 &

          QEMU_PID=$!
          echo "Started host QEMU process (PID $QEMU_PID). Collecting serial stream..."
          
          # Allow kernel and userspace to boot and stream PL011 UART logs
          sleep 25
          kill -9 $QEMU_PID || true

          echo "=== Host QEMU Serial Console Log Output ==="
          cat host-qemu-boot.log
          echo "==========================================="

          # Assert genuine Linux kernel boot telemetry
          echo "Validating genuine kernel & userspace boot telemetry..."
          grep -q "Booting Linux on physical CPU" host-qemu-boot.log || (echo "FATAL: Booting Linux banner not found in serial log" && exit 1)
          grep -q "Linux version" host-qemu-boot.log || (echo "FATAL: Linux version banner not found in serial log" && exit 1)
          grep -q "pl011" host-qemu-boot.log || (echo "FATAL: pl011 earlycon log not found in serial log" && exit 1)
          grep -q "initramfs" host-qemu-boot.log || (echo "FATAL: initramfs log not found in serial log" && exit 1)

          # Assert no kernel panic
          if grep -i "Kernel panic" host-qemu-boot.log; then
              echo "FATAL: Kernel panic detected in serial boot log!" >&2
              exit 1
          fi
          echo "✓ Confirmed: NO kernel panic detected!"

          # Assert early-userspace execution
          if grep -E "(OpenRC|Run /sbin/init as init process|Welcome to Alpine Linux|login:|/bin/sh)" host-qemu-boot.log; then
              echo "✓ Early-userspace execution confirmed in serial boot log!"
          else
              echo "FATAL: Expected early-userspace output (OpenRC / init / shell prompt) not found in boot log!" >&2
              exit 1
          fi
          echo "✓ Stage 1 Kernel & Userspace boot successfully verified!"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Host Kernel Boot Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-host-kernel-boot-log
          path: host-qemu-boot.log
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxilBox-Phase1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
