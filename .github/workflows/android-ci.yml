name: Android CI & Guest Engine Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1 — Kernel: Standard aarch64 cross-compile using kbuild directly
  # =========================================================================
  build-kernel:
    name: "Job 1 — Build ARM64 Virt Linux Kernel"
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Install Toolchain & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bison \
            flex \
            libssl-dev \
            bc \
            libelf-dev \
            kmod \
            file

      - name: Shallow Clone Linux Kernel (v6.6 LTS)
        run: |
          git clone --depth 1 --branch v6.6 https://github.com/torvalds/linux.git linux-src

      - name: Configure Kernel for QEMU virt Machine (PLAN.md Stage 1)
        working-directory: linux-src
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          # Serial & Earlycon Console
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE
          ./scripts/config --enable CONFIG_SERIAL_EARLYCON
          ./scripts/config --disable CONFIG_SERIAL_EARLYCON_ARM_SEMIHOST

          # VirtIO Core & Transport
          ./scripts/config --enable CONFIG_VIRTIO
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_PCI_MODERN
          ./scripts/config --enable CONFIG_VIRTIO_MMIO
          ./scripts/config --enable CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES

          # VirtIO Storage
          ./scripts/config --enable CONFIG_VIRTIO_BLK
          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_EXT4_FS_POSIX_ACL
          ./scripts/config --enable CONFIG_EXT4_FS_SECURITY

          # Core Hardware & Addressing
          ./scripts/config --enable CONFIG_ARM64_VA_BITS_48
          ./scripts/config --enable CONFIG_ARM64_4K_PAGES
          ./scripts/config --enable CONFIG_ARM64_GIC_V3
          ./scripts/config --enable CONFIG_ARM64_GIC_V3_ITS
          ./scripts/config --enable CONFIG_PCI
          ./scripts/config --enable CONFIG_PCI_HOST_GENERIC
          ./scripts/config --enable CONFIG_PCI_ECAM

          # Logging & TTY
          ./scripts/config --enable CONFIG_PRINTK
          ./scripts/config --enable CONFIG_PRINTK_TIME
          ./scripts/config --enable CONFIG_TTY

          # Stage 1 Minimal: Disable virtio-gpu and virtio-input to keep scoped
          ./scripts/config --disable CONFIG_DRM_VIRTIO_GPU
          ./scripts/config --disable CONFIG_VIRTIO_INPUT
          ./scripts/config --disable CONFIG_INPUT_EVDEV

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build ARM64 Kernel Image
        working-directory: linux-src
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Verify Kernel Image Artifact
        working-directory: linux-src
        run: |
          ls -lh arch/arm64/boot/Image
          file arch/arm64/boot/Image

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-kernel-image
          path: linux-src/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7

  # =========================================================================
  # JOB 2 — QEMU + deps: Termux Bionic aarch64 jniLibs Packaging
  # =========================================================================
  build-qemu:
    name: "Job 2 — Build/Package QEMU aarch64 & Bionic Dependencies"
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf binutils-aarch64-linux-gnu file curl python3

      - name: Provision QEMU & Bionic Shared Libs Bundle (jniLibs arm64-v8a)
        run: |
          bash tools/engine/package-termux-qemu.sh jniLibs-bundle/arm64-v8a

      - name: Verify ELF Architecture & Linked Dependencies
        run: |
          file jniLibs-bundle/arm64-v8a/libqemu_system_aarch64.so
          aarch64-linux-gnu-readelf -h jniLibs-bundle/arm64-v8a/libqemu_system_aarch64.so
          echo "=== jniLibs Bundle Contents ==="
          ls -la jniLibs-bundle/arm64-v8a/

      - name: Strict Transitive Dependency Assertion (DT_NEEDED Completeness)
        run: |
          python3 - <<'EOF'
          import os, sys, subprocess, re

          bundle_dir = "jniLibs-bundle/arm64-v8a"
          system_libs = {"libc.so", "libm.so", "libdl.so", "liblog.so"}
          bundle_files = set(os.listdir(bundle_dir))

          print(f"=== Checking DT_NEEDED Completeness across {len(bundle_files)} libraries ===")
          missing_deps = {}

          for fname in sorted(bundle_files):
              if not (fname.startswith("lib") and fname.endswith(".so")):
                  continue
              fpath = os.path.join(bundle_dir, fname)
              try:
                  out = subprocess.check_output(["readelf", "-d", fpath], text=True, errors="ignore")
              except Exception as e:
                  print(f"Error reading ELF headers for {fname}: {e}", file=sys.stderr)
                  sys.exit(1)

              for line in out.splitlines():
                  if "(NEEDED)" in line:
                      m = re.search(r'\[(.*?)\]', line)
                      if m:
                          dep = m.group(1)
                          if dep in system_libs:
                              continue
                          if dep not in bundle_files:
                              missing_deps.setdefault(fname, []).append(dep)

          if missing_deps:
              print("FATAL: Found unsatisfied transitive DT_NEEDED dependencies:", file=sys.stderr)
              for so, missing in missing_deps.items():
                  print(f"  - {so} missing: {missing}", file=sys.stderr)
              sys.exit(1)

          print("✓ 100% DT_NEEDED completeness verified: all transitive dependencies are present in the bundle.")
          EOF

      - name: Upload QEMU jniLibs Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-jniLibs-bundle
          path: jniLibs-bundle/
          if-no-files-found: error
          retention-days: 7

  # =========================================================================
  # JOB 3 — App Build: Bundle Job 1 & 2 Artifacts + Host QEMU Kernel Sanity Check
  # =========================================================================
  build-app:
    name: "Job 3 — App Build & Host QEMU Kernel Sanity Check"
    runs-on: ubuntu-latest
    needs: [build-kernel, build-qemu]
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Download Kernel Artifact (Job 1)
        uses: actions/download-artifact@v4
        with:
          name: guest-kernel-image
          path: app/src/main/assets/kernel/

      - name: Download QEMU jniLibs Bundle Artifact (Job 2)
        uses: actions/download-artifact@v4
        with:
          name: qemu-jniLibs-bundle
          path: app/src/main/jniLibs/

      - name: Verify Packaged Asset & jniLibs Structure
        run: |
          echo "=== App Raw Assets (Kernel) ==="
          ls -lh app/src/main/assets/kernel/
          echo "=== App Native Libraries (jniLibs/arm64-v8a) ==="
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK Native Libraries (lib/*.so)
        run: |
          echo "=== Inspecting Debug APK Contents for jniLibs ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/" || true

      - name: Install QEMU Runner for Host Sanity Check
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc

      - name: Kernel Sanity Check via Host-Native QEMU (ARM64 Kernel Verification)
        run: |
          echo "=== Running Kernel Sanity Check via Host-Native QEMU Runner ==="
          echo "Note: This step verifies the built ARM64 Linux kernel Image using the host runner's native QEMU emulator."
          echo "The bundled Android Bionic QEMU binary in jniLibs requires a physical ARM64 Android device with nativeLibraryDir execution."
          
          qemu-system-aarch64 \
            -M virt,gic-version=3 \
            -cpu max \
            -smp 2 \
            -m 512M \
            -kernel app/src/main/assets/kernel/Image \
            -append "console=ttyAMA0 earlycon=pl011,0x09000000 panic=-1 printk.devkmsg=on" \
            -display none \
            -monitor none \
            -serial stdio \
            -no-reboot > host-qemu-boot.log 2>&1 &

          QEMU_PID=$!
          echo "Started host QEMU process (PID $QEMU_PID). Collecting serial stream..."
          
          # Allow kernel to boot and stream PL011 UART logs
          sleep 20
          kill -9 $QEMU_PID || true

          echo "=== Host QEMU Serial Console Log Output ==="
          cat host-qemu-boot.log
          echo "==========================================="

          # Assert genuine Linux kernel boot telemetry
          echo "Validating genuine kernel boot telemetry..."
          grep -q "Booting Linux on physical CPU" host-qemu-boot.log || (echo "FATAL: Booting Linux banner not found in serial log" && exit 1)
          grep -q "Linux version" host-qemu-boot.log || (echo "FATAL: Linux version banner not found in serial log" && exit 1)
          grep -q "pl011" host-qemu-boot.log || (echo "FATAL: pl011 earlycon log not found in serial log" && exit 1)
          echo "✓ Kernel sanity check verified on host QEMU runner!"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Host Kernel Boot Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-host-kernel-boot-log
          path: host-qemu-boot.log
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxilBox-Phase1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
